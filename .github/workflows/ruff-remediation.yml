name: Ruff remediation

on:
  push:
    branches:
      - chore/ruff-0.16-remediation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: chore/ruff-0.16-remediation
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - name: Restore executable scripts
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -qx '#!/usr/bin/env python3'; then
              chmod +x "$file"
            fi
          done < <(find scripts services -type f -name '*.py' -print0)
      - name: Apply safe Ruff fixes
        run: ruff check . --fix || true
      - name: Commit remediation
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "style(python): apply Ruff 0.16 safe fixes [skip ruff-remediation]"
          git push
