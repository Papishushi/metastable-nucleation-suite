name: Validate Ruff remediation

on:
  push:
    branches:
      - chore/ruff-0.16-remediation

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: chore/ruff-0.16-remediation
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -e .[dev]
      - name: Run validation
        shell: bash
        run: |
          set +e
          ruff check . > .validation-report.txt 2>&1
          ruff_status=$?
          pytest -q >> .validation-report.txt 2>&1
          pytest_status=$?
          printf '\nruff_status=%s\npytest_status=%s\n' "$ruff_status" "$pytest_status" >> .validation-report.txt
          exit 0
      - name: Commit validation report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .validation-report.txt
          git commit -m "test: record Ruff remediation validation [skip validation]"
          git push
